<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>En Riesgo · Simulador de proyectos PMBOK 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{--red:#E50914;--dred:#B20710;--black:#141414;--gray:#f5f5f5;--mid:#6b6b6b;--line:#e4e4e4;--amber:#F5A524;--green:#2E9E5B;--blue:#2B6CB0;--bg:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--black);font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
img.px,canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
.wrap{max-width:1260px;margin:0 auto;padding:0 20px}
.bebas{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;letter-spacing:.5px;font-weight:400}
.pixel{font-family:Silkscreen,"Courier New",monospace}
.kicker{font-family:Silkscreen,monospace;font-size:12px;color:var(--red);letter-spacing:1px;text-transform:uppercase}
.muted{color:var(--mid)}
.small{font-size:13px}
.h1{font-family:"Bebas Neue",Impact,sans-serif;font-size:clamp(52px,8vw,104px);line-height:.9;letter-spacing:1px}
.h2{font-family:"Bebas Neue",Impact,sans-serif;font-size:clamp(34px,4.5vw,52px);line-height:.95;letter-spacing:.5px}
.h3{font-family:"Bebas Neue",Impact,sans-serif;font-size:26px;line-height:1;letter-spacing:.5px}
.lead{font-size:17px;max-width:640px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--black)}
.top .wrap{display:flex;align-items:center;gap:18px;height:58px}
.logo{font-family:"Bebas Neue",Impact,sans-serif;font-size:32px;color:var(--red);letter-spacing:1px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo img{width:22px;height:22px}
.stepper{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.step{font-family:Silkscreen,monospace;font-size:11px;padding:5px 9px;border:2px solid var(--line);color:var(--mid);white-space:nowrap}
.step.on{border-color:var(--black);background:var(--black);color:#fff}
.step.done{border-color:var(--black);color:var(--black)}
.codechip{font-family:Silkscreen,monospace;font-size:12px;border:2px solid var(--black);padding:4px 8px;white-space:nowrap;background:#fff}
/* buttons */
.btn{font-family:"Bebas Neue",Impact,sans-serif;font-size:22px;letter-spacing:1px;background:var(--red);color:#fff;border:2px solid var(--black);box-shadow:4px 4px 0 var(--black);padding:7px 20px 5px;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--black)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--black)}
.btn.ghost{background:#fff;color:var(--black)}
.btn.dark{background:var(--black);color:#fff}
.btn.sm{font-size:17px;padding:4px 12px 2px;box-shadow:3px 3px 0 var(--black)}
.btn[disabled]{background:#ddd;color:#888;cursor:not-allowed;box-shadow:2px 2px 0 #999;transform:none;border-color:#999}
/* cards */
.card{background:#fff;border:2px solid var(--black);box-shadow:4px 4px 0 var(--black);padding:16px;position:relative}
.card.flat{box-shadow:none}
.card.sel{outline:4px solid var(--red);outline-offset:2px}
.card.click{cursor:pointer;transition:transform .1s,box-shadow .1s}
.card.click:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--black)}
.card.dim{opacity:.55}
.chip{display:inline-block;font-family:Silkscreen,monospace;font-size:11px;border:2px solid var(--black);padding:1px 6px;background:#fff;white-space:nowrap}
.chip.red{background:var(--red);color:#fff}
.chip.dark{background:var(--black);color:#fff}
.chip.amber{background:var(--amber)}
.chip.green{background:var(--green);color:#fff}
.chip.blue{background:var(--blue);color:#fff}
.chip.ghost{border-color:var(--line);color:var(--mid)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.sec{padding:34px 0}
.rowtitle{font-family:"Bebas Neue",Impact,sans-serif;font-size:28px;margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.rowtitle .muted{font-family:Inter;font-size:13px}
.row{display:flex;gap:16px;overflow-x:auto;padding:4px 8px 14px 2px;scroll-snap-type:x proximity}
.row>*{flex:0 0 auto;scroll-snap-align:start}
.row::-webkit-scrollbar{height:8px}.row::-webkit-scrollbar-thumb{background:var(--black)}
.redrule{height:6px;background:var(--red);border:2px solid var(--black)}
/* bars */
.bar{height:14px;border:2px solid var(--black);background:#fff;position:relative;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--black);transition:width .4s}
.bar.red>i{background:var(--red)}.bar.green>i{background:var(--green)}.bar.amber>i{background:var(--amber)}.bar.blue>i{background:var(--blue)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,#fff 9px 11px);pointer-events:none}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--red);z-index:2}
.pips{display:inline-flex;gap:3px}
.pips i{width:11px;height:11px;border:2px solid var(--black);display:inline-block;background:#fff}
.pips i.on{background:var(--black)}
.pips.red i.on{background:var(--red)}
/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:center;padding:40px 0 10px}
.hero canvas{width:100%;border:2px solid var(--black);box-shadow:8px 8px 0 var(--black);background:#fafafa}
.codebox{margin-top:22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.codebox input{font-family:Silkscreen,monospace;font-size:15px;border:2px solid var(--black);padding:7px 10px;width:150px;text-transform:uppercase}
.top5 .card{width:250px;min-height:170px;padding:14px 14px 14px 92px;overflow:hidden}
.bignum{position:absolute;left:-6px;bottom:-26px;font-family:"Bebas Neue",Impact,sans-serif;font-size:170px;line-height:1;color:#fff;-webkit-text-stroke:3px var(--black)}
.badge{width:150px;text-align:center;padding:12px 10px}
.badge.lock{filter:grayscale(1);opacity:.45}
/* scene */
.scene{width:100%;border:2px solid var(--black);background:#fafafa;display:block}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{border:2px solid var(--black);padding:9px 11px;background:#fff}
.kpi .lab{font-family:Silkscreen,monospace;font-size:11px;color:var(--mid);display:flex;justify-content:space-between;gap:6px}
.kpi .val{font-family:"Bebas Neue",Impact,sans-serif;font-size:30px;line-height:1.05}
/* member */
.member{width:205px;padding:12px}
.member .face{width:64px;height:64px;border:2px solid var(--black);background:var(--gray)}
.stat{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:6px;font-size:12px}
/* signals */
.signal{width:270px;border-color:var(--black);background:#fff}
.signal .eye{width:36px;height:36px}
.risk{width:270px}
/* bottom bar */
.dock{position:sticky;bottom:0;z-index:15;background:#fff;border-top:2px solid var(--black);margin-top:30px}
.dock .wrap{display:flex;align-items:center;gap:16px;min-height:66px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.toggle{display:inline-flex;border:2px solid var(--black)}
.toggle button{border:0;background:#fff;padding:6px 10px;font-family:Silkscreen,monospace;font-size:12px}
.toggle button.on{background:var(--black);color:#fff}
.toggle button.on.red{background:var(--red)}
.toggle button[disabled]{color:#aaa;cursor:not-allowed}
.mentor{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
.mfaces,.mtips{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.mtips{margin-top:16px;align-items:center;gap:8px}
.mface{border:2px solid var(--line);background:#fff;padding:4px 6px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:Silkscreen,monospace;font-size:9px;color:var(--black)}
.mface:hover{border-color:var(--black)}
.mface.on{border-color:var(--black);background:var(--gray);box-shadow:3px 3px 0 var(--red)}
.bubble{flex:1;min-width:240px;border:2px solid var(--black);padding:10px 14px;position:relative;background:#fff;box-shadow:4px 4px 0 var(--black)}
.bubble p{margin-top:4px;font-size:14.5px}
#mtip .bubble{margin-top:10px}
/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;background:rgba(20,20,20,.55);overflow-y:auto;padding:30px 14px}
#modal.on{display:flex}
.mbox{background:#fff;border:3px solid var(--black);box-shadow:10px 10px 0 var(--black);width:min(780px,100%);animation:pop .18s ease-out}
.mhead{padding:18px 22px 14px;border-bottom:3px solid var(--black);display:flex;gap:16px;align-items:center}
.mhead.red{background:var(--red);color:#fff}
.mhead.red .kicker{color:#fff}
.mhead.amber{background:var(--amber)}
.mhead.amber .kicker{color:var(--black)}
.mhead.dark{background:var(--black);color:#fff}
.mhead.dark .kicker{color:#ff8a8f}
.mbody{padding:18px 22px 22px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--black);box-shadow:3px 3px 0 var(--black);padding:12px 14px;margin-top:10px;transition:transform .08s,box-shadow .08s}
.opt:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--black);background:#fff8f8}
.opt b{font-size:16px;display:block}
.opt span{font-size:13px;color:var(--mid)}
.opt.cont{border-color:var(--green);box-shadow:3px 3px 0 var(--green)}
.delta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.delta .chip{font-size:12px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes blink{50%{opacity:.25}}
.blink{animation:blink 1s steps(2) infinite}
#toast{position:fixed;right:20px;bottom:88px;z-index:60;display:flex;flex-direction:column-reverse;gap:8px;align-items:flex-end;pointer-events:none;max-width:min(420px,calc(100vw - 40px))}
.toast{background:var(--black);color:#fff;border:2px solid var(--black);padding:8px 14px;font-size:14px;box-shadow:4px 4px 0 var(--red);animation:pop .2s}
/* log */
.log{max-height:300px;overflow-y:auto;border:2px solid var(--black);background:#fff}
.log div{padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px}
.log div b{font-family:Silkscreen,monospace;font-size:10px;color:var(--mid);margin-right:6px}
.log .r{border-left:5px solid var(--red)}.log .g{border-left:5px solid var(--green)}.log .a{border-left:5px solid var(--amber)}
/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:3px;background:var(--black)}
.tl .it{position:relative;margin-bottom:14px}
.tl .it:before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border:2px solid var(--black);background:#fff}
.tl .it.cause:before{background:var(--black)}
.tl .it.bad:before{background:var(--red)}
.tl .it.good:before{background:var(--green)}
.tl .arrow{font-family:Silkscreen,monospace;font-size:11px;color:var(--mid)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border:2px solid var(--black);padding:7px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--black);color:#fff;font-family:Silkscreen,monospace;font-size:11px;font-weight:400}
.respbtns{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.respbtns button{font-family:Silkscreen,monospace;font-size:10px;border:2px solid var(--black);background:#fff;padding:3px 6px}
.respbtns button.on{background:var(--black);color:#fff}
.ownerbtns{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.ownerbtns button{border:2px solid var(--line);background:#fff;padding:0;width:34px;height:34px}
.ownerbtns button.on{border-color:var(--red);outline:2px solid var(--red)}
.ownerbtns img{width:30px;height:30px;display:block}
.quote{border-left:5px solid var(--red);padding:6px 12px;font-style:italic;background:var(--gray)}
.evid{border-left:5px solid var(--black);padding:6px 12px;background:#fff;border-top:1px dashed var(--line)}
.tok{width:18px;height:18px;border:2px solid var(--black);display:inline-block;background:var(--red)}
.tok.off{background:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px}
.legend i{display:inline-block;width:18px;height:4px;vertical-align:middle;margin-right:5px}
.ending{background:var(--black);color:#fff;border:2px solid var(--black);box-shadow:8px 8px 0 var(--red);padding:28px}
.ending .kicker{color:#ff8a8f}
.ending .chip{color:var(--black)}.ending .chip.red{color:#fff}
.notice{border:2px dashed var(--black);padding:10px 14px;background:var(--gray);font-size:14px}
@media (max-width:900px){
 .hero{grid-template-columns:1fr}
 .g2,.g3{grid-template-columns:1fr}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .top .wrap{height:auto;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
 .stepper{order:3;flex-basis:100%}
 .logo{font-size:26px}
 .dock .wrap{gap:8px;min-height:0}
 .dock .btn{font-size:19px}
 .member,.signal,.risk{width:240px}
}
</style>
</head>

 cro:['En el último proyecto las reuniones se cancelaban y los insumos llegaban tarde; nadie lo registró.','Hay un cronograma, pero se actualizó por última vez hace dos meses.','Los acuerdos de fechas se cumplen y la disponibilidad está confirmada por escrito.'],
 fin:['No existe línea base de costos ni una métrica de beneficio.','Hay presupuesto, pero nadie lo compara con el valor esperado.','El caso de negocio tiene métricas y responsables del beneficio.'],

 int:['Los usuarios se enteraron del proyecto por un rumor; varios lo ven como una amenaza a su puesto.','Los usuarios conocen el proyecto, pero nadie les preguntó su opinión.','Un grupo de usuarios participa en las pruebas y da retroalimentación.'],
 rie:['La última crisis se resolvió "apagando incendios" durante una semana.','Hay una lista de riesgos en un correo antiguo, sin responsables.','El registro de riesgos está actualizado y se usa en las reuniones.']
};
const band=v=>v<=2?0:v===3?1:2;

const PROJECTS=[
 {id:'turnoya',nombre:'TurnoYa',cliente:'Red Veterinaria Patitas',sector:'Salud animal',desc:'App y panel web para agendar citas en seis clínicas veterinarias y enviar recordatorios.',problema:'Las clínicas pierden 1 de cada 5 citas por olvidos y el teléfono colapsa los lunes.',objetivo:'Reducir las citas perdidas a menos del 8 % en el primer trimestre de uso.',tags:['ext','datos'],cx:1.05,deadline:12,cambios:['recordatorios por WhatsApp','historial clínico con fotos','pagos anticipados en línea'],modulo:'agenda',usuarios:'recepcionistas',externo:'la API de mensajería'},
 {id:'mercabarrio',nombre:'MercaBarrio',cliente:'Asociación de Tenderos del Norte',sector:'Comercio',desc:'Tienda en línea compartida para que las tiendas de barrio reciban pedidos a domicilio.',problema:'Las tiendas pierden clientes frente a las grandes cadenas con domicilios.',objetivo:'Que 40 tiendas reciban al menos 15 pedidos en línea por semana.',tags:['ext','pagos','datos'],cx:1.12,deadline:12,cambios:['cupones de descuento','pago con código QR','programa de puntos'],modulo:'carrito de compras',usuarios:'tenderos',externo:'la pasarela de pagos'},
 {id:'rutasegura',nombre:'RutaSegura',cliente:'Colegio Los Andes',sector:'Educación',desc:'App para que los padres sigan en tiempo real la ruta escolar de sus hijos.',problema:'Los padres llaman 200 veces al día preguntando dónde va la ruta.',objetivo:'Reducir en 80 % las llamadas a coordinación de rutas.',tags:['ext','datos','pico'],cx:1.08,deadline:12,cambios:['chat con el conductor','botón de pánico','reporte de asistencia automático'],modulo:'seguimiento GPS',usuarios:'conductores',externo:'el servicio de mapas'},
 {id:'agroconecta',nombre:'AgroConecta',cliente:'Cooperativa Campo Vivo',sector:'Agro',desc:'Marketplace que conecta a productores campesinos con restaurantes de la ciudad.',problema:'Los intermediarios se quedan con el 45 % del precio final.',objetivo:'Que 60 productores vendan directo a 30 restaurantes en seis meses.',tags:['pagos','ext'],cx:1.1,deadline:13,cambios:['subasta de cosechas','integración con transportadoras','precios dinámicos'],modulo:'catálogo de cosechas',usuarios:'productores',externo:'la pasarela de pagos'},

function hashSeed(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCode(){let s='';for(let i=0;i<7;i++)s+=ALPH[Math.floor(Math.random()*ALPH.length)];return fmtCode(s)}
function fmtCode(raw){const c=String(raw).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10);return c.length<=4?c:c.slice(0,4)+'-'+c.slice(4)}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r1=v=>Math.round(v*10)/10;
const money=v=>'$'+(Math.round(v*10)/10).toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:1})+' M';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function singular(s){const w=s.split(' ');let f=w[0];if(/res$/.test(f))f=f.slice(0,-2);else if(/s$/.test(f))f=f.slice(0,-1);w[0]=f;return w.join(' ')}
function fill(t,g,ctx){
 if(!t)return'';
 const tm=ctx&&ctx.target?g.team.find(m=>m.id===ctx.target):null;
 return t.replace(/\{(\w+)\}/g,(m,k)=>{
  switch(k){
   case 'sponsor':return g.sponsor.nombre.split(' ')[0];
   case 'modulo':return g.proj.modulo;
   case 'usuarios':return g.proj.usuarios;
   case 'usuario':return singular(g.proj.usuarios);

   case 'cansado':return ctx&&ctx.cansado?ctx.cansado:'Alguien del equipo';
   case 'dev':return ctx&&ctx.dev?ctx.dev:'Un desarrollador';

function genCands(rs,n,pref){
 n=n||14;pref=pref||'m';
 const devs=ROLES.filter(r=>DEVROLES.includes(r.id)),others=ROLES.filter(r=>!DEVROLES.includes(r.id));
 const nd=Math.ceil(n*.45);
 const roles=[...Array.from({length:nd},(_,i)=>i<devs.length?shuffle(rs,devs)[i%devs.length]:pick(rs,devs)),...shuffle(rs,others).concat(shuffle(rs,others)).slice(0,n-nd)];
 const tl=Object.keys(TRAITS);const used={};const names=shuffle(rs,NOMBRES);
 return shuffle(rs,roles).map((ro,i)=>{
  const s={tec:ri(rs,1,4),com:ri(rs,1,4),est:ri(rs,1,4),cal:ri(rs,1,4)};
  for(const k in ro.b)s[k]=clamp(s[k]+ro.b[k],1,5);
  let sen=ro.id==='jr'?'Junior':rs()<.28?'Junior':rs()<.35?'Senior':'Semi-senior';
  if(sen==='Junior'){s.tec=clamp(s.tec-1,1,5);s.est=clamp(s.est-1,1,5)}
  if(sen==='Senior'){s.tec=clamp(s.tec+1,1,5);s.est=clamp(s.est+1,1,5)}
  let trait=null;
  if(ro.id==='jr'&&rs()<.55)trait='aprendiz';
  else if(rs()<.66){for(let t=0;t<8;t++){const c=pick(rs,tl);if((used[c]||0)<2){trait=c;break}}}
  if(trait)used[trait]=(used[trait]||0)+1;
  const showRef=trait?rs()<.75:rs()<.4;
  const ref=showRef?(trait?TRAITS[trait].ref:pick(rs,REF_NEUTRAL)):null;
  const cost=r1(.35+s.tec*.13+(s.com+s.est+s.cal)*.05+(sen==='Senior'?.15:0)+rs()*.15);
  return{id:pref+i,nombre:names[i%names.length]+' '+pick(rs,APELLIDOS),role:ro.id,roleN:ro.n,sen,...s,trait,ref,cost,look:genLook(rs),energy:100,gone:false,out:0,onb:0,rev:false};
 });
}
function nuevaConvocatoria(g,keep){
 const r=mulberry(hashSeed(g.code+'|conv'));
 const nuevos=genCands(r,g.N.cands-keep.length,'c');
 g.cands=[...g.cands.filter(c=>keep.includes(c.id)),...nuevos];
 g.convocatoria=true;g.gastado+=1;
}
function crearPartida(code,nivel){
 const rs=mulberry(hashSeed(code+'|setup'));
 const g={code,rs,rr:mulberry(hashSeed(code+'|run'))};
 g.nivel=nivel||'alto';g.N=NIVELES[g.nivel];
 g.proj=pick(rs,PROJECTS);
 g.arch=pick(rs,ARCHETYPES);
 g.cli0={};DIMS.forEach(d=>{let v=g.arch.base[d.k];if(rs()<.45)v+=rs()<.5?-1:1;g.cli0[d.k]=clamp(v,1,5)});
 g.cli={...g.cli0};
 g.cliAvg0=DIMS.reduce((s,d)=>s+g.cli0[d.k],0)/7;
 g.decl={};DIMS.forEach(d=>g.decl[d.k]=clamp(g.cli0[d.k]+ri(rs,0,g.arch.sinc),1,5));
 g.diag={};g.reuniones=g.N.reuniones;g.reunionesMax=g.N.reuniones;
 g.deadline=Math.max(5,Math.round(g.proj.deadline*g.N.f)+pick(rs,[-1,0,0,1]));
 g.cx=g.proj.cx+(rs()-.5)*.16;
 g.B=Math.round(g.deadline*5.0*g.cx);

/* ================= CÁLCULOS ================= */

 const ml=g.S*bias/cap;
 const avgEst=a.reduce((s,m)=>s+m.est,0)/a.length;

function armarMazo(g){

  const inst={id:r.id,def:r,p,status:'latente',reg:null,inv:1,ident:null,visible:false,target:null};
  if(r.id==='renuncia'){const nom=g.team.find(m=>m.trait==='nomada');const t=nom||[...g.team].sort((a,b)=>b.tec-a.tec)[0];inst.target=t.id}

 for(const i of g.deck){i.visible=!!i.def.siempre||(g.diag[i.def.dom]?i.p.u2<.85:i.p.u2<.4);if(i.def.tipo==='oportunidad')i.visible=i.p.u2<.55;if(i.visible)i.ident='plan'}

}

/* ================= SEMANA ================= */
function generarSenales(g){
 g.signals=[];
 for(const inst of g.deck){
  if(inst.status!=='latente')continue;
  if(g.sem<inst.start-2||g.sem>inst.end)continue;
  if(inst.def.tipo==='amenaza'&&riskP(g,inst)<.05)continue;
  let ch=.42;
  if(inst.reg){const o=g.team.find(m=>m.id===inst.reg.owner);if(o&&!o.gone)ch*=.7+.12*o.com}
  if(hasT(g,'silencioso')&&['tecnica','deuda','burnout','conflicto'].includes(inst.id))ch*=.55;
  if(inst.p.sig[g.sem]<ch&&g.signals.length<3){
   const tx=inst.def.senales;const t=tx[(g.sem+Math.floor(inst.p.u*10))%tx.length];
   g.signals.push({id:'s'+g.sem+inst.id,risk:inst.id,txt:fill(t,g,inst),done:false});
  }
 }
 if(g.noise[g.sem]<.35)g.signals.push({id:'n'+g.sem,risk:null,txt:SENAL_FALSA[(g.sem*7+g.code.charCodeAt(0))%SENAL_FALSA.length],done:false});

function simular(g,notas){

 for(const m of a){
  if(m.out>0){m.out--;m.energy=clamp(m.energy+20,0,100);continue}
  let c=m.tec*(.55+.45*m.energy/100);
  if(m.trait==='perfeccionista')c*=.9;
  if(m.trait==='atajista')c*=1.12;
  if(m.trait==='heroe'&&behind)c*=1.2;

  if(m.onb>0){c*=.5;m.onb--}
  if(m.trait==='aprendiz'&&g.sem%3===0&&m.tec<5){m.tec++;m.rev=true;notas.push(m.nombre.split(' ')[0]+' aprendió rápido: su técnica sube a '+m.tec+'.')}

 cap*=(.75+.5*g.moral/100)*(1-g.deuda/220)*(.82+.06*g.cli.rec)*(1+g.velPct/100)*enfV*estV;
 const prog=Math.max(0,cap*1.0);
 g.avance=Math.min(g.alcance,g.avance+prog);g.lastProg=prog;

/* ================= EVENTOS ================= */
function prepararEvento(g,ev){
 const ctx={};
 const a=act(g).filter(m=>m.out===0);
 const top=[...a].sort((x,y)=>y.tec-x.tec)[0];
 ctx.dev=top?top.nombre.split(' ')[0]:'Alguien';ctx.devId=top&&top.id;
 if(ev.k==='dilema'&&ev.d.id==='heroe'){const h=a.find(m=>m.trait==='heroe');if(h){ctx.dev=h.nombre.split(' ')[0];ctx.devId=h.id}}
 if(ev.k==='riesgo'){
  const inst=ev.inst;ctx.target=inst.target;
  const r=inst.def;
  if(r.tipo==='amenaza'){
   const ef=respEf(g,inst);
   ctx.sev=(inst.reg?1-ef*.6:(inst.visible?1:1.25))*diagFactor(g,r.dom);ctx.diag=diagEstado(g,r.dom);
   if(r.golpe.burnout){const v=a.find(m=>m.trait==='heroe')||[...a].sort((x,y)=>x.energy-y.energy)[0];if(v){ctx.cansado=v.nombre.split(' ')[0];ctx.victim=v.id}}
  }else{
   ctx.mag=inst.reg?1+respEf(g,inst)*.6:.7;
  }
 }
 ev.ctx=ctx;return ev;
}
function golpear(g,ev){
 const inst=ev.inst,r=inst.def,ctx=ev.ctx;const notas=[];
 const a=snap(g);
 if(r.tipo!=='amenaza')return{dl:[],notas};
 applyFx(g,scaleFx(r.golpe.fx,ctx.sev),notas);
 if(r.golpe.renuncia){
  const t=g.team.find(m=>m.id===inst.target);
  if(t&&!t.gone){t.gone=true;t.rev=true;g.stats.renuncias++;g.avance=Math.max(0,g.avance-t.tec*2.5*ctx.sev*(hasT(g,'documentador')?.5:1));notas.push(t.nombre+' deja el proyecto ('+t.roleN+').')}
 }
 if(r.golpe.burnout&&ctx.victim){const v=g.team.find(m=>m.id===ctx.victim);v.out=2;v.rev=true;v.energy=30;g.stats.burnouts++}
 const titulo=fill(r.golpe.t,g,ctx);
 g.causal.push({semC:inst.reg?0:null,causa:inst.reg?('Registraste "'+r.nombre+'" con la respuesta '+RESPN[inst.reg.resp]+(inst.reg.sem?' (semana '+inst.reg.sem+')':' (planificación)')):('"'+r.nombre+'" no estaba en tu registro de riesgos'),semE:g.sem,efecto:'Riesgo materializado: '+titulo,good:false,riesgo:true});
 addLog(g,'Riesgo: '+titulo,'r');g.alarma=true;
 return{dl:deltas(a,snap(g)),notas};
}
function elegirOpcion(g,ev,idx){
 const ctx=ev.ctx||{};const notas=[];const a=snap(g);
 let titulo,ops,o;
 if(ev.k==='riesgo'){
  const r=ev.inst.def;ops=opcionesRiesgo(g,ev);o=ops[idx];titulo=fill(r.golpe.t,g,ctx);
  const sc=r.tipo==='oportunidad'?ctx.mag:1;
  applyFx(g,scaleFx(evalFx(g,o.fx),sc),notas);
  if(r.tipo==='oportunidad'&&o.flag)g.flags[o.flag]=true;
  if(r.tipo==='oportunidad'&&idx<2)ev.inst.capturada=true;
 }else if(ev.k==='revision'){
  ops=opcionesRevision(g);o=ops[idx];titulo='Revisión de avance';
  o.run(g,notas);
 }else{
  const d=ev.d;ops=d.ops;o=ops[idx];titulo=fill(d.titulo,g,ctx);
  applyFx(g,o.fx,notas);
 }
 if(o.flag)g.flags[o.flag]=true;
 if(o.sinControl)g.stats.cambiosSinControl++;
 if(o.conControl){g.stats.cambiosConControl++;if(hasT(g,'negociador')){g.confianza=clamp(g.confianza+3,0,100);notas.push('Tu negociador hizo que el cliente valorara el control del cambio.')}}
 if(o.energiaDev&&ctx.devId){const m=g.team.find(x=>x.id===ctx.devId);if(m)m.energy=clamp(m.energy+o.energiaDev,0,100)}
 if(o.forzarExtra){if(g.flags.sinExtra)notas.push('Tu propio registro de riesgos prohíbe las horas extra: el reto se hará a ritmo normal.');else g.forzarExtra+=o.forzarExtra}
 if(o.reemplazo)contratarReemplazo(g,ev,notas);
 if(o.despido){const c=act(g).sort((x,y)=>x.cost-y.cost)[0];if(c&&act(g).length>1){c.gone=true;notas.push(c.nombre+' sale del proyecto por el recorte.')}}
 if(o.dif&&o.dif.length)programarDif(g,o.dif,{sem:g.sem,txt:'Elegiste "'+fill(o.t,g,ctx)+'" en «'+titulo+'»'});
 const b=snap(g);
 g.decisiones.push({sem:g.sem,titulo,tipo:ev.k,elegida:idx,ops:ops.map(x=>({t:fill(x.t,g,ctx),alt:x.alt||''})),peso:Math.abs(b.avance-a.avance)+Math.abs(b.confianza-a.confianza)+(o.dif?8:0)+Math.abs(b.alcance-a.alcance)});
 addLog(g,'Decisión: '+fill(o.t,g,ctx),'a');
 return{dl:deltas(a,b),notas:notas.concat(o.dif&&o.dif.length?['Algunas consecuencias de esta decisión podrían aparecer más adelante.']:[])};
}
function contratarReemplazo(g,ev,notas){
 const rr=g.rr;const lost=ev.inst&&g.team.find(m=>m.id===ev.inst.target);
 const role=lost?lost.role:'full';const ro=ROLES.find(r=>r.id===role);
 const m={id:'r'+g.sem,nombre:pick(rr,NOMBRES)+' '+pick(rr,APELLIDOS),role,roleN:ro.n,tec:3,com:3,est:3,cal:3,trait:null,ref:null,cost:r1((lost?lost.cost:1.1)*1.2),look:genLook(rr),energy:100,gone:false,out:0,onb:2,rev:true,nuevo:true};
 g.team.push(m);notas.push(m.nombre+' se incorpora al equipo (necesita dos semanas de inducción).');
}
function opcionesRiesgo(g,ev){
 const r=ev.inst.def;const ops=r.ops.slice();
 if(r.tipo==='amenaza'&&ev.inst.reg&&r.cont&&respEf(g,ev.inst)>=.3)ops.unshift({...r.cont,d:'Tenías un plan para esto.',cont:true,alt:'Tener un plan de contingencia convierte una crisis en un procedimiento.'});
 return ops;
}
function datosRevision(g){
 const w=g.sem;const pl=planned(g,w);const spi=g.avance/Math.max(1,pl);
 const last=g.hist.slice(-3);let vel=g.lastProg||1;
 if(last.length>=2){vel=(last[last.length-1].avance-last[0].avance)/Math.max(1,last.length-1)}
 vel=Math.max(.5,vel);
 const restante=g.alcance-g.avance;const fin=Math.ceil(w+restante/vel);
 const planCost=teamCost(g)*w;const cpi=planCost/Math.max(1,g.gastado);
 return{spi,cpi,fin,vel,restante,pl};
}

 return[

  {t:'Plan de recuperación con horas extra',d:'Tres semanas de sobreesfuerzo.',run:(g,n)=>{if(g.flags.sinExtra){n.push('Tu registro de riesgos prohíbe las horas extra: el plan no se puede aplicar.');return}g.forzarExtra+=3;n.push('El equipo trabajará con horas extra las próximas tres semanas.')},alt:'Recuperar con horas extra funciona a corto plazo y cobra en energía, moral y deuda.'},
  {t:'Recortar alcance con MoSCoW',d:'Sacar lo que no es esencial para llegar a la fecha.',run:(g,n)=>{const cut=Math.max(0,d.restante-d.vel*(g.baseline-g.sem+1));const pct=-Math.min(30,Math.round(cut/g.alcance*100));applyFx(g,{alcancePct:pct,desc:true,valor:-4,confianza:-3},n)},alt:'Recortar con MoSCoW protege la fecha sacrificando valor de baja prioridad.'},

 ];

function accionEquipo(g,id){
 const m=g.team.find(x=>x.id===id);if(!m||g.pts<1||g.usados['1a1'+id])return null;
 g.pts--;g.usados['1a1'+id]=1;g.stats.unoauno++;
 m.energy=clamp(m.energy+15,0,100);g.moral=clamp(g.moral+3,0,100);
 if(m.trait&&!m.rev){m.rev=true;return 'En la conversación descubres algo de '+m.nombre.split(' ')[0]+': '+TRAITS[m.trait].n+'. '+TRAITS[m.trait].d}
 if(m.energy<50)return m.nombre.split(' ')[0]+' te cuenta que está cansado. La conversación le ayudó.';
 return m.nombre.split(' ')[0]+' está bien. Una conversación a tiempo también es prevención.';
}
const ACTIONS=[
 {id:'sponsor',n:'Reunión con el sponsor',d:'Alinear expectativas y destrabar decisiones.',c:1,ic:'clock'},
 {id:'demo',n:'Demo con usuarios',d:'Mostrar avances a quienes usarán la solución.',c:1,ic:'eye'},
 {id:'calidad',n:'Revisión técnica',d:'Pruebas y refactorización de lo construido.',c:1,ic:'shield'},
 {id:'capacitar',n:'Acompañar al cliente',d:'Capacitar y transferir prácticas a su equipo.',c:1,ic:'heart'},
 {id:'riesgos',n:'Taller de riesgos',d:'Revisar el registro y buscar riesgos nuevos.',c:2,ic:'warn'}
];
function accion(g,id){
 const A=ACTIONS.find(a=>a.id===id);if(!A||g.pts<A.c||g.usados[id])return null;
 g.pts-=A.c;g.usados[id]=1;
 switch(id){
  case 'sponsor':{g.stats.reunionesSponsor++;g.visita=true;g.confianza=clamp(g.confianza+2+(hasT(g,'puente')?2:0),0,100);g.cli.gob=Math.min(5,g.cli.gob+.1);
   const un=DIMS.find(d=>g.diag[d.k]!==2);
   if(un&&g.stats.reunionesSponsor%2===1){g.diag[un.k]=2;return 'Conversando con '+g.sponsor.nombre.split(' ')[0]+' observas cómo funciona realmente su '+un.n.toLowerCase()+': nivel '+g.cli0[un.k]+' de 5.'}
   return 'Reunión productiva. La confianza del cliente mejora.'}
  case 'demo':{g.stats.demos++;addValor(g,Math.max(.5,1.5+(g.cli.int-3)*.5));g.confianza=clamp(g.confianza+2,0,100);return 'Los usuarios vieron el avance y dieron retroalimentación.'}
  case 'calidad':{g.deuda=clamp(g.deuda-8,0,100);g.avance=Math.max(0,g.avance-1.5);return 'El equipo dedicó tiempo a pruebas y refactorización.'}
  case 'capacitar':{g.stats.capacitaciones++;addValor(g,1.5);const k=DIMS.map(d=>d.k).sort((x,y)=>g.cli[x]-g.cli[y])[0];g.cli[k]=Math.min(5,g.cli[k]+.3);return 'Acompañaste al equipo del cliente en '+DIMN[k].toLowerCase()+'.'}
  case 'riesgos':{g.stats.talleres++;const h=g.deck.filter(i=>!i.visible&&i.status==='latente').sort((x,y)=>y.score-x.score)[0];
   if(h){h.visible=true;h.ident='taller';return{nuevo:h}}
   return 'El taller no encontró riesgos nuevos. Revisaron las respuestas actuales.'}
 }
}
function investigar(g,sid){
 const s=g.signals.find(x=>x.id===sid);if(!s||s.done||g.pts<1)return null;
 g.pts--;s.done=true;
 if(!s.risk){g.stats.senalesFalsas++;return{msg:'Falsa alarma. No todo es un riesgo, y la atención del líder es limitada.'}}
 const inst=g.deck.find(i=>i.id===s.risk);g.stats.senalesReales++;
 const opp=inst.def.tipo==='oportunidad';
 if(inst.reg){inst.inv*=opp?1.4:.5;inst.senal=true;return{msg:opp?'Moviste ficha a tiempo: la oportunidad tiene más probabilidad de darse.':'Actuaste sobre la señal temprana de "'+inst.def.nombre+'". Su probabilidad bajó.'}}
 inst.visible=true;if(!inst.ident)inst.ident='monitoreo';inst.inv*=opp?1.3:.7;inst.senal=true;
 return{nuevo:inst,msg:'La señal revela un '+(opp?'oportunidad':'riesgo')+' que no estaba en tu registro: "'+inst.def.nombre+'".'};
}
function registrar(g,inst,resp,owner){

}

const FINALES={
 ejemplar:{t:'Entrega ejemplar',x:'A tiempo, dentro del presupuesto y con usuarios que realmente usan la solución. No fue suerte: anticipaste, mediste y ajustaste.'},
 nadie:{t:'A tiempo, pero nadie lo usa',x:'Cumpliste la fecha, pero el valor no llegó. PMBOK 8 lo dice claro: el éxito se mide por resultados, no por entregables.'},
 heroe:{t:'El héroe se quemó',x:'Llegaste a tiempo sobre la espalda de alguien que terminó agotado. El cronograma se cumplió; el equipo pagó la cuenta.'},
 tarde:{t:'Tarde, pero con valor',x:'La fecha se movió, pero lo que entregaste sí resuelve el problema del cliente. ¿Se podía anticipar ese retraso desde la estimación?'},
 sobrecosto:{t:'Sobrecosto silencioso',x:'El proyecto se entregó, pero costó bastante más de lo aprobado. Las reservas y el control de costos existen para esto.'},
 recortado:{t:'Entrega recortada',x:'Llegaste, pero con buena parte del alcance original por fuera. Recortar puede ser sabio… o la consecuencia de no ver los riesgos a tiempo.'},
 cicatrices:{t:'Entregado con cicatrices',x:'El proyecto salió, con golpes en el camino. Revisa la línea de tiempo: casi todas las cicatrices tienen una decisión de origen.'},
 infinito:{t:'El proyecto infinito',x:'Llegaste al límite de semanas sin terminar. El alcance creció más rápido que el avance, y nadie detuvo la máquina.'},
 cancelado:{t:'Proyecto cancelado',x:''}
};
function calcularCierre(g){
 const r={};
 r.entregado=g.fin==='entregado';
 r.semFin=r.entregado?g.sem:null;
 r.pctAlcance=g.avance/g.alcance;
 r.pctOriginal=g.avance/g.S;
 r.costoPct=g.gastado/g.B;
 r.defectos=Math.round(g.deuda/6);
 r.valor=clamp(g.valor*(.4+.6*Math.min(1,g.avance/g.S))*(.65+.35*(1-g.deuda/100))*(g.fin==='cancelado'?.35:g.fin==='limite'?.7:1)*1.1,0,100);
 const aE=avgE(g);
 const ths=g.deck.filter(i=>i.def.tipo==='amenaza');
 const mat=ths.filter(i=>i.status==='materializado');
 const goodReg=mat.filter(i=>i.reg&&respEf(g,i)>=.5).length;
 r.noVistos=mat.filter(i=>!i.reg).length;
 r.matCount=mat.length;
 r.estFit=g.estrategia===estrategiaFit(g);r.enfFit=g.enfoque===enfoqueFit(g);
 const st=g.stats;
 r.dom={
  gob:clamp(45+8*st.cambiosConControl-10*st.cambiosSinControl+(g.flags.transparente?12:0)-(g.flags.sandia?20:0)+Math.min(12,st.reunionesSponsor*3)+(r.estFit?10:-5),0,100),
  alc:clamp(100*Math.min(1,g.avance/g.S)*.8+15-7*st.cambiosSinControl+(g.diag.alc===2?5:0),0,100),
  cro:r.entregado?clamp(100-Math.max(0,r.semFin-g.baseline0)*14,10,100):10,
  fin:clamp(100-Math.max(0,r.costoPct-1)*300,0,100),
  rec:clamp((g.moral+aE)/2-st.burnouts*15-st.renuncias*10+(st.semanasExtra===0?5:0),0,100),
  int:clamp(r.valor*.65+g.confianza*.35,0,100),
  rie:clamp(35+40*(mat.length?goodReg/mat.length:1)+4*st.senalesReales-8*r.noVistos,0,100)
 };
 r.global=Math.round(Object.values(r.dom).reduce((s,v)=>s+v,0)/7);
 const onTime=r.entregado&&r.semFin<=g.baseline0;
 let k;
 if(g.fin==='cancelado')k='cancelado';
 else if(g.fin==='limite')k='infinito';
 else if(onTime&&r.costoPct<=1.05&&r.valor>=58&&g.moral>=45)k='ejemplar';
 else if(onTime&&r.valor<40)k='nadie';
 else if(st.burnouts>0&&onTime)k='heroe';
 else if(!onTime&&r.valor>=58&&r.costoPct<=1.15)k='tarde';
 else if(r.costoPct>1.15)k='sobrecosto';
 else if(r.pctOriginal<.85)k='recortado';
 else k='cicatrices';
 r.final=k;r.finT=FINALES[k].t;r.finX=k==='cancelado'?g.motivo:FINALES[k].x;
 r.madurez0=g.cliAvg0;r.madurez1=DIMS.reduce((s,d)=>s+g.cli[d.k],0)/7;
 // logros
 const L=[];
 if(mat.length>0&&r.noVistos===0)L.push('cero');
 if(st.senalesReales>=4)L.push('ojo');
 if(DIMS.filter(d=>g.diag[d.k]===2).length>=3)L.push('triang');
 if(st.semanasExtra===0&&st.burnouts===0&&r.entregado)L.push('sinheroes');
 if(g.flags.transparente||g.flags.replan)L.push('transp');
 if(r.estFit&&r.enfFit)L.push('ajuste');
 if(k==='ejemplar')L.push('ejemplar');
 if(r.madurez1-r.madurez0>=.5)L.push('madurez');
 if(r.entregado&&r.noVistos>=2)L.push('sobrev');
 if(g.flags.sandia)L.push('sandia');
 if(g.deck.some(i=>i.def.tipo==='oportunidad'&&i.reg&&i.capturada))L.push('oportunista');
 if(k==='infinito')L.push('infinito');
 r.logros=L;
 g.cierre=r;return r;
}

 return R;
}

function drawOffice(cv,st,frame){
 const s=Math.max(2,Math.floor((cv.clientWidth||OW*3)/OW));
 if(cv.width!==OW*s){cv.width=OW*s;cv.height=OH*s}
 const x=cv.getContext('2d');x.imageSmoothingEnabled=false;
 const R=(a,b,w,h,c)=>{x.fillStyle=c;x.fillRect(a*s,b*s,w*s,h*s)};
 R(0,0,OW,78,'#fbfbfb');
 for(let i=0;i<OW;i+=16)R(i,76,1,2,'#eeeeee');
 for(let j=78;j<OH;j+=6)for(let i=0;i<OW;i+=6)R(i+((j/6)%2?3:0),j,3,6,'#efefef');
 R(0,78,OW,OH-78,'#f2f2f2');
 for(let j=78;j<OH;j+=8)for(let i=((j/8)%2)*8;i<OW;i+=16)R(i,j,8,8,'#e8e8e8');
 R(0,77,OW,2,'#141414');
 // ventana
 R(8,10,42,32,'#141414');R(10,12,38,28,st.noche?'#2a3550':'#d7ecff');R(28,12,2,28,'#141414');R(10,25,38,2,'#141414');
 const cx=(frame%40);R(12+cx%30,15,8,3,'#ffffff');R(14+cx%30,13,4,2,'#ffffff');
 // tablero kanban
 R(60,8,84,40,'#141414');R(62,10,80,36,'#ffffff');
 R(88,10,1,36,'#dddddd');R(115,10,1,36,'#dddddd');
 const pct=st.pct||0;const tot=9;const done=Math.round(pct*tot);const doing=Math.min(3,tot-done);
 for(let i=0;i<tot;i++){const col=i<done?2:i<done+doing?1:0;const k=i<done?i:i<done+doing?i-done:i-done-doing;const px=64+col*27+(k%3)*8,py=13+Math.floor(k/3)*9;R(px,py,6,6,col===2?'#2E9E5B':col===1?'#F5A524':'#cfcfcf')}
 // reloj y planta
 R(152,12,14,14,'#141414');R(154,14,10,10,'#ffffff');R(158,16,2,4,'#141414');R(158,19,4,2,'#141414');
 R(236,58,12,18,'#8B5E3C');R(234,48,6,10,'#2E9E5B');R(240,44,6,14,'#2E9E5B');R(245,50,5,8,'#2E9E5B');
 // puerta
 R(206,24,26,54,'#141414');R(208,26,22,52,'#e9e3da');R(226,50,2,3,'#141414');
 if(st.visita){const g=outlined(bustGrid(st.visita,{blink:frame%9===0}));paint(x,g,210*s,40*s,s)}
 // alarma
 if(st.alarma){R(178,6,12,6,'#141414');R(179,7,10,4,frame%2?'#E50914':'#7a0a10');if(frame%2){R(174,4,3,2,'#E50914');R(191,4,3,2,'#E50914')}}
 // escritorios
 const team=st.team||[];const n=Math.max(team.length,3);const gap=Math.min(46,190/n);
 team.forEach((m,i)=>{
  const dx=12+i*gap;const dy=86;
  // silla
  R(dx+10,dy-2,14,4,'#4a4a4a');
  if(!m.gone&&!m.out){
   const bob=(frame+i)%6===0?1:0;
   const g=outlined(bustGrid(m.look,{blink:(frame+i*3)%11===0,sad:m.energy<35,sweat:st.extra||m.energy<30}));
   paint(x,g,(dx+8)*s,(dy-22+bob)*s,s);
   if(m.energy<35&&frame%4<2){R(dx+28,dy-24,3,1,'#141414');R(dx+30,dy-27,2,1,'#141414')}
  }
  if(m.out&&!m.gone){R(dx+12,dy-12,8,8,'#ffffff');R(dx+15,dy-11,2,6,'#E50914');R(dx+13,dy-9,6,2,'#E50914')}
  // escritorio
  R(dx,dy,36,4,'#A0704C');R(dx,dy+4,36,2,'#7d5235');R(dx+2,dy+6,3,14,'#7d5235');R(dx+31,dy+6,3,14,'#7d5235');
  // monitor
  R(dx+20,dy-11,14,10,'#141414');R(dx+21,dy-10,12,7,m.gone?'#555':((frame+i)%5===0?'#5a8fd6':'#2B6CB0'));R(dx+26,dy-1,2,1,'#141414');
  if(!m.gone&&!m.out&&(frame+i)%3===0)R(dx+22,dy-8,6,1,'#ffffff');
  if(m.gone){R(dx+6,dy-6,10,6,'#d9d9d9');}
 });
 if(st.signal&&frame%2===0){R(120,50,12,14,'#141414');R(122,52,8,10,'#F5A524');R(125,53,2,5,'#141414');R(125,59,2,2,'#141414')}
}

function mascotGrid(o){
 o=o||{};
 const G=Array.from({length:16},()=>Array(16).fill(null));
 const set=(x,y,c)=>{if(x>=0&&x<16&&y>=0&&y<16)G[y][x]=c};
 const rect=(x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)set(x+i,y+j,c)};
 const R='#E50914',D='#B20710',W='#ffffff',K='#141414';
 rect(3,1,10,12,R);rect(3,1,1,12,D);rect(13,2,1,11,W);rect(4,13,10,1,'#e8e8e8');
 // número 8
 rect(7,2,3,1,W);set(6,3,W);set(10,3,W);rect(7,4,3,1,W);set(6,5,W);set(10,5,W);rect(7,6,3,1,W);
 // ojos
 if(o.blink){rect(5,9,2,1,K);rect(10,9,2,1,K)}else{rect(5,8,2,2,W);set(6,9,K);rect(10,8,2,2,W);set(11,9,K)}
 rect(7,11,3,1,D);
 // brazos y pies
 set(2,8,R);set(1,9,R);set(14,8,R);set(15,7,R);
 rect(5,14,2,1,K);rect(10,14,2,1,K);
 return G;
}

/* ---------- DIAGNÓSTICO ---------- */
function radarSVG(series,labels,size){
 size=size||300;const cx=size/2,cy=size/2,R=size/2-52,n=labels.length;
 const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v,cy+Math.sin(a)*R*v]};
 let h='<svg viewBox="0 0 '+size+' '+size+'" width="100%" style="max-width:'+size+'px;display:block;margin:auto" role="img" aria-label="Gráfico de radar">';
 for(let k=1;k<=5;k++){h+='<polygon points="'+labels.map((_,i)=>pt(i,k/5).join(',')).join(' ')+'" fill="none" stroke="'+(k===5?'#141414':'#e4e4e4')+'" stroke-width="'+(k===5?2:1)+'"/>'}
 labels.forEach((l,i)=>{const[x,y]=pt(i,1);h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="#e4e4e4"/>';const[lx,ly]=pt(i,1.2);h+='<text x="'+lx+'" y="'+ly+'" font-size="10.5" font-family="Inter" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#141414">'+l+'</text>'});
 series.forEach(s=>{const pts=s.v.map((v,i)=>v==null?null:pt(i,v));if(pts.every(p=>!p))return;const pp=pts.map((p,i)=>p||pt(i,0));h+='<polygon points="'+pp.map(p=>p.join(',')).join(' ')+'" fill="'+(s.fill||'none')+'" stroke="'+s.c+'" stroke-width="'+(s.w||2.5)+'" '+(s.dash?'stroke-dasharray="5 4"':'')+'/>';pts.forEach(p=>{if(p)h+='<rect x="'+(p[0]-3)+'" y="'+(p[1]-3)+'" width="6" height="6" fill="'+s.c+'"/>'})});
 return h+'</svg>';
}

function respCost(c){const p=[];if(!c)return'Sin costo inicial';if(c.dinero)p.push((c.dinero>0?'':'ahorra ')+money(Math.abs(c.dinero)));if(c.avance)p.push(Math.abs(c.avance)+' pts de avance');if(c.alcancePct)p.push(Math.abs(c.alcancePct)+' % de alcance');if(c.valor)p.push('algo de valor');if(c.confianza)p.push(Math.abs(c.confianza)+' de confianza');if(c.velPct)p.push(Math.abs(c.velPct)+' % de velocidad');if(c.costoSem)p.push('+'+money(c.costoSem)+'/sem');return p.length?'Cuesta: '+p.join(' · '):'Sin costo inicial'}

 }

function kpis(){
 const pct=G.avance/G.alcance*100;const plan=planned(G,G.sem-1)/G.alcance*100;
 const spi=spiNow(G);const gp=G.gastado/G.budget*100;
 const k=(lab,val,extra,sub)=>'<div class="kpi"><div class="lab"><span>'+lab+'</span>'+(sub||'')+'</div><div class="val">'+val+'</div>'+(extra||'')+'</div>';
 return'<div class="kpis">'+
  k('Avance',Math.round(pct)+' %',bar(pct,'',plan),'<span>'+Math.round(G.avance)+' / '+Math.round(G.alcance)+' pts</span>')+
  k('Cronograma','SPI '+spi.toFixed(2),bar(spi*80,spi<.9?'red':spi<1?'amber':'green'),'<span>'+(spi<.9?'Atrasado':spi<1?'Leve atraso':'En plan')+'</span>')+
  k('Presupuesto',money(G.gastado),bar(gp,gp>100?'red':gp>85?'amber':'')+'<div class="small muted" style="margin-top:3px">de '+money(G.budget)+'</div>')+
  k('Calidad',Math.round(G.calVis),bar(G.calVis,G.calVis<55?'red':G.calVis<75?'amber':'green'),'<span>'+(hasR(G,'qa')?'medida por QA':'sin QA: estimada')+'</span>')+
  k('Moral del equipo',Math.round(G.moral),bar(G.moral,G.moral<40?'red':G.moral<60?'amber':'green'))+
  k('Confianza del cliente',Math.round(G.confianza),bar(G.confianza,G.confianza<30?'red':G.confianza<50?'amber':'blue'))+
 '</div>';
}
function burnup(){
 const W=320,H=150,P=26;const maxW=limite(G);const maxY=Math.max(G.alcance,G.alcanceBase,G.S)*1.08;
 const X=w=>P+w/maxW*(W-P-8),Y=v=>H-P+4-v/maxY*(H-P-6);
 const hs=G.hist;
 let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Gráfico de avance">';
 s+='<line x1="'+P+'" y1="'+Y(0)+'" x2="'+(W-8)+'" y2="'+Y(0)+'" stroke="#141414" stroke-width="2"/><line x1="'+P+'" y1="'+Y(0)+'" x2="'+P+'" y2="6" stroke="#141414" stroke-width="2"/>';
 s+='<line x1="'+X(G.baseline)+'" y1="6" x2="'+X(G.baseline)+'" y2="'+Y(0)+'" stroke="#E50914" stroke-dasharray="3 3"/><text x="'+X(G.baseline)+'" y="'+(H-6)+'" font-size="9" text-anchor="middle" font-family="Inter" fill="#E50914" dy="-'+(H-14)+'">línea base</text>';
 s+='<polyline points="'+X(0)+','+Y(0)+' '+X(G.baseline)+','+Y(G.alcanceBase)+' '+X(maxW)+','+Y(G.alcanceBase)+'" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="5 4"/>';
 s+='<polyline points="'+hs.map(h=>X(h.sem)+','+Y(h.alcance)).join(' ')+'" fill="none" stroke="#F5A524" stroke-width="2"/>';
 s+='<polyline points="'+hs.map(h=>X(h.sem)+','+Y(h.avance)).join(' ')+'" fill="none" stroke="#141414" stroke-width="3"/>';
 hs.forEach(h=>{s+='<rect x="'+(X(h.sem)-2.5)+'" y="'+(Y(h.avance)-2.5)+'" width="5" height="5" fill="#141414"/>'});
 s+='<text x="4" y="12" font-size="9" font-family="Inter" fill="#6b6b6b">pts</text><text x="'+(W-8)+'" y="'+(H-6)+'" font-size="9" text-anchor="end" font-family="Inter" fill="#6b6b6b">sem '+maxW+'</text>';
 return s+'</svg><div class="legend"><span><i style="background:#141414"></i>Avance real</span><span><i style="background:#9a9a9a"></i>Plan</span><span><i style="background:#F5A524"></i>Alcance</span></div>';
}

 '<div class="flex" style="margin-top:20px"><span class="chip red">Desempeño global '+r.global+' / 100</span><span class="chip">Valor entregado: '+(r.valor>=65?'alto':r.valor>=40?'medio':'bajo')+'</span><span class="chip">Defectos en producción: '+r.defectos+'</span></div></div>'+
 '<div><canvas id="office" class="scene px"></canvas></div></div>'+
 (r.nuevos&&r.nuevos.length?'<div class="row" style="margin-top:20px">'+r.nuevos.map(id=>{const l=LOGROS.find(x=>x.id===id);return'<div class="card badge">'+img(icon(l.ic,6),44)+'<div class="kicker">¡Logro nuevo!</div><div class="h3" style="font-size:20px">'+l.n+'</div><div class="small muted">'+l.d+'</div></div>'}).join('')+'</div>':'')+
 '<h2 class="rowtitle">Línea base vs. realidad</h2><div class="grid g2"><table class="t"><tr><th>Indicador</th><th>Comprometido</th><th>Real</th></tr>'+
 kv('Entrega','Semana '+G.baseline0+' (el cliente pedía '+G.deadline+')',r.entregado?'Semana '+r.semFin:'No se entregó',!r.entregado||r.semFin>G.baseline0)+
 kv('Alcance',G.S+' pts',Math.round(G.avance)+' pts ('+Math.round(r.pctOriginal*100)+' % del original)',r.pctOriginal<.9)+
 kv('Costo',money(G.B),money(G.gastado)+' ('+Math.round(r.costoPct*100)+' %)',r.costoPct>1.05)+
 kv('Moral del equipo','—',Math.round(G.moral)+' / 100',G.moral<45)+
 kv('Confianza del cliente','—',Math.round(G.confianza)+' / 100',G.confianza<40)+
 kv('Deuda técnica (oculta)','—',Math.round(G.deuda)+' / 100',G.deuda>40)+
 kv('Valor real (oculto)','—',Math.round(r.valor)+' / 100',r.valor<45)+
 '</table><div class="card">'+radarSVG([{v:DIMS.map(d=>r.dom[d.k]/100),c:'#E50914',fill:'rgba(229,9,20,.1)'}],dl,320)+'<p class="small muted" style="text-align:center">Desempeño por dominio (0–100)</p></div></div>'+

 '<h2 class="rowtitle">Línea de tiempo: causas y efectos <span class="muted">Lo que decidiste y lo que provocó</span></h2>'+
 (tl.length?'<div class="card flat"><div class="tl">'+tl.map(c=>'<div class="it '+(c.good?'good':'bad')+'"><div class="arrow">'+(c.semC!=null&&!c.riesgo?'SEMANA '+c.semC+' → SEMANA '+c.semE:'SEMANA '+c.semE)+'</div><div class="small muted">'+esc(c.causa)+'</div><div><b>'+esc(c.efecto)+'</b></div></div>').join('')+'</div></div>':'<p class="muted">No hubo consecuencias diferidas ni riesgos materializados. Raro… ¿o muy buena gestión?</p>')+

 (decs.length?'<h2 class="rowtitle">¿Y si hubieras…? <span class="muted">Tus decisiones de mayor impacto y sus alternativas</span></h2><div class="grid g3">'+decs.map(d=>'<div class="card"><div class="kicker">Semana '+d.sem+'</div><div class="h3" style="margin:4px 0 8px">'+esc(d.titulo)+'</div><div class="evid small"><b>Elegiste:</b> '+esc(d.ops[d.elegida].t)+'<br><span class="muted">'+esc(d.ops[d.elegida].alt)+'</span></div>'+d.ops.filter((_,i)=>i!==d.elegida).map(o=>'<div class="small" style="margin-top:8px"><b>Si hubieras elegido "'+esc(o.t)+'":</b> '+esc(o.alt)+'</div>').join('')+'</div>').join('')+'</div>':'')+

 '<h2 class="rowtitle">Lecciones aprendidas: tus riesgos</h2><div class="grid gauto">'+ths.map(i=>{const rd=i.def;const opp=rd.tipo==='oportunidad';const b=best(i);
  const st=i.status==='materializado'?(opp?'<span class="chip amber">Se presentó en la semana '+i.matSem+'</span>':'<span class="chip red">Ocurrió en la semana '+i.matSem+'</span>'):(opp?'<span class="chip ghost">No se presentó</span>':'<span class="chip green">No ocurrió</span>');
  const id=!i.visible?'<span class="chip ghost">Nunca lo identificaste</span>':i.ident==='plan'?'<span class="chip">Visible desde el plan</span>':'<span class="chip">Identificado en '+(i.ident==='taller'?'un taller':'el monitoreo')+'</span>';
  return'<div class="card"><div class="flex" style="flex-wrap:nowrap;gap:8px">'+img(icon(opp?'star':'warn',3),24)+'<div class="h3" style="font-size:21px">'+rd.nombre+'</div></div><div class="flex" style="margin-top:6px">'+st+id+'</div>'+
  (i.reg?'<div class="evid small" style="margin-top:8px"><b>Tu respuesta: '+RESPN[i.reg.resp]+'</b> — '+esc(fill(rd.resp[i.reg.resp].a,G,i))+'<br>'+esc(rd.resp[i.reg.resp].n)+'</div>':'<p class="small" style="margin-top:8px">Sin respuesta registrada.</p>')+
  (!i.reg||i.reg.resp!==b?'<div class="small" style="margin-top:8px;border-top:1px dashed var(--line);padding-top:6px"><b>En este contexto suele funcionar mejor: '+RESPN[b]+'</b> — '+esc(fill(rd.resp[b].a,G,i))+'. '+esc(rd.resp[b].n)+'</div>':'')+
  '<div class="pixel" style="font-size:10px;color:var(--mid);margin-top:8px">'+rd.ref+'</div></div>'}).join('')+'</div>'+

 '<h2 class="rowtitle">Tu cliente realmente era…</h2><div class="grid g2"><div class="card">'+radarSVG([{v:DIMS.map(d=>G.diag[d.k]?G.decl[d.k]/5:null),c:'#9a9a9a',dash:true},{v:DIMS.map(d=>c0[d.k]/5),c:'#141414'},{v:DIMS.map(d=>G.cli[d.k]/5),c:'#E50914'}],dl,320)+'<div class="legend" style="justify-content:center"><span><i style="background:#9a9a9a"></i>Lo que declaró</span><span><i style="background:#141414"></i>Real al inicio</span><span><i style="background:#E50914"></i>Al cierre</span></div></div>'+
 '<div style="display:grid;gap:12px;align-content:start"><div class="card flat"><div class="kicker">Perfil</div><div class="h3">'+G.arch.n+'</div><p class="small">Madurez promedio: <b>'+r1(r.madurez0)+'</b> al inicio → <b>'+r1(r.madurez1)+'</b> al cierre. Diagnosticaste '+DIMS.filter(d=>G.diag[d.k]).length+' de 7 dimensiones y verificaste '+DIMS.filter(d=>G.diag[d.k]===2).length+'.</p></div>'+
 '<div class="card flat"><div class="kicker">Estrategia</div><p class="small">Elegiste <b>'+ESTR.find(e=>e.id===G.estrategia).n+'</b>. Para su madurez real ('+r1(G.cliAvg0)+') encajaba mejor <b>'+ESTR.find(e=>e.id===estrategiaFit(G)).n+'</b>. '+(r.estFit?'Ajuste correcto.':'El desajuste pesó en costos, riesgos o confianza.')+'</p></div>'+
 '<div class="card flat"><div class="kicker">Enfoque</div><p class="small">Elegiste <b>'+ENF.find(e=>e.id===G.enfoque).n+'</b>. '+(G.enfoque===enfoqueFit(G)?'Encajaba con el cliente.':'Con este cliente encajaba mejor <b>'+ENF.find(e=>e.id===enfoqueFit(G)).n+'</b>: '+({predictivo:'tenía alcance claro y cumplía cronogramas.',agil:'tenía personas disponibles y usuarios involucrados.',hibrido:'necesitaba estructura formal con flexibilidad funcional.'}[enfoqueFit(G)]))+'</p></div></div></div>'+

 '<h2 class="rowtitle">Tu equipo realmente era…</h2><div class="row">'+G.team.map(m=>'<div class="card member">'+img(face(m.look,3,{gray:m.gone}),56,'face')+'<div style="font-weight:700;margin-top:6px">'+esc(m.nombre)+'</div><div class="small muted">'+m.roleN+'</div><div style="margin-top:8px">'+(m.trait?'<span class="chip dark">'+TRAITS[m.trait].n+'</span><p class="small" style="margin-top:6px">'+TRAITS[m.trait].d+'</p>'+(!m.rev?'<p class="small" style="color:var(--red)">No lo descubriste durante el proyecto.</p>':''):'<span class="chip ghost">Sin rasgos especiales</span>')+'</div></div>').join('')+'</div>'+

 '<div class="notice" style="margin-top:26px"><b>Para discutir en clase:</b> ¿qué riesgo pudiste ver antes? ¿Qué decisión volverías a tomar igual aunque haya salido mal? ¿Qué señal ignoraste? Puedes repetir este mismo proyecto para probar otra ruta y comparar.</div>'+
 '<div class="flex" style="margin:24px 0 40px"><button class="btn" data-act="start">▶ Nuevo proyecto</button><button class="btn ghost" data-act="replay">↺ Repetir este mismo proyecto</button><button class="btn ghost" data-act="home">Inicio</button></div></main>'+
 '<style>@media(max-width:900px){#cgrid{grid-template-columns:1fr!important}}</style>';
}

/* ---------- ACCIONES ---------- */
function nuevo(code,nivel){G=crearPartida(code||newCode(),nivel||UI.nivel);UI.sel={};UI.regSel={};UI.heroTeam=null;go('encargo')}
const ACT={
 home(){if(G&&UI.screen!=='cierre'&&UI.screen!=='portada'&&!confirmSalir())return;go('portada')},
 start(){nuevo()},
 nivel(d){UI.nivel=d.id;LS.set('enriesgo_nivel',d.id);render()},
 replay(){nuevo(G.code,G.nivel)},
 mentor(d){UI.mSel=d.id;render()},
 mtip(d){const b=$('#mtip');if(b){UI.mSel=d.id;b.innerHTML=bubble(d.id,tipEvento(G,UI.ev,d.id));document.querySelectorAll('.mtips .mface').forEach(x=>x.classList.toggle('on',x.dataset.id===d.id))}},
 convocar(){if(G.convocatoria)return;nuevaConvocatoria(G,Object.keys(UI.sel).filter(k=>UI.sel[k]));toast('Nueva convocatoria publicada: llegaron candidatos nuevos ($1,0 M).');render()},
 howto(){howto()},
 close(){closeModal()},
 go(d){if(d.s==='estrategia'&&UI.screen==='diagnostico'&&G.reuniones===G.reunionesMax){toast('Haz al menos una pregunta antes de cerrar el diagnóstico.');return}go(d.s)},
 preguntar(d){if(G.reuniones<1)return;G.reuniones--;G.diag[d.k]=1;render()},
 evidencia(d){if(G.reuniones<1)return;G.reuniones--;G.diag[d.k]=2;render()},
 estr(d){G.estrategia=d.id;render()},
 enf(d){G.enfoque=d.id;render()},
 reserva(d){G.reserva=+d.v;render()},
 cand(d){UI.sel[d.id]=!UI.sel[d.id];render()},
 confirmTeam(){G.team=G.cands.filter(c=>UI.sel[c.id]).map(c=>({...c}));go('compromiso')},
 comp(d){const o=UI.copts.find(x=>x.id===d.id);G.compromiso=d.id;G.baseline=o.w;
  const base=55;G.confianza=base+(d.id==='cliente'?8:d.id==='equipo'?(o.w<=G.deadline?4:-(o.w-G.deadline)*3):-(Math.max(0,o.w-G.deadline))*3-2);
  G.confianza=clamp(G.confianza,20,75);G.deck=[];UI.regSel={};render()},
 regtoggle(d){const s=UI.regSel[d.id]||(UI.regSel[d.id]={});if(!s.on&&Object.values(UI.regSel).filter(x=>x.on).length>=G.N.maxReg){toast('Máximo '+G.N.maxReg+' riesgos registrados en la planificación en este nivel.');return}s.on=!s.on;render()},
 regresp(d){const s=UI.regSel[d.id]||(UI.regSel[d.id]={on:true});s.resp=d.k;if(UI.screen==='registro'&&!$('#modal.on'))render();else regModal(UI.regInst)},
 regowner(d){const s=UI.regSel[d.id]||(UI.regSel[d.id]={on:true});s.owner=d.m;if(UI.screen==='registro'&&!$('#modal.on'))render();else regModal(UI.regInst)},
 iniciar(){for(const i of G.deck){const s=UI.regSel[i.id];if(s&&s.on&&s.resp&&s.owner)i.reg={resp:s.resp,owner:s.owner,sem:0}}iniciarEjecucion(G);go('ejecucion')},
 investigar(d){const r=investigar(G,d.id);if(!r)return;if(r.nuevo){addLog(G,'Señal investigada: '+r.nuevo.def.nombre,'a');render();regModal(r.nuevo,r.msg)}else{toast(r.msg);addLog(G,r.msg,'a');render()}},
 accion(d){const r=accion(G,d.id);if(r==null)return;if(typeof r==='object'&&r.nuevo){addLog(G,'Taller de riesgos: apareció "'+r.nuevo.def.nombre+'"','a');render();regModal(r.nuevo,'El taller identificó un riesgo que no estaba en tu radar.')}else{toast(r);addLog(G,r,'');render()}},
 '1a1'(d){const r=accionEquipo(G,d.id);if(r){toast(r);addLog(G,r,'');render()}},
 regmodal(d){const i=G.deck.find(x=>x.id===d.id);regModal(i)},
 regConfirm(){const i=UI.regInst,s=UI.regSel[i.id];registrar(G,i,s.resp,s.owner);addLog(G,'Registraste "'+i.def.nombre+'" con la respuesta '+RESPN[s.resp]+'.','g');closeModal();render()},
 regSkip(){closeModal();render()},
 ritmo(d){if(G.flags.sinExtra&&d.v==='extra')return;G.ritmo=d.v;render()},
 cerrarSemana(){const rep=cerrarSemanaCore(G);UI.evq=G.eventos.slice();mostrarReporte(rep)},
 nextEv(){siguienteEvento()},
 opt(d){resultadoOpcion(+d.i)}
};
function confirmSalir(){UI.confirm=true;openModal('<div class="mhead dark"><div><div class="kicker">Salir</div><div class="h2">¿Abandonar el proyecto?</div></div></div><div class="mbody"><p>Perderás el avance de este proyecto. Tendrás que empezar un proyecto nuevo.</p><div class="flex" style="margin-top:14px"><button class="btn" data-act="salirOk">Sí, salir</button><button class="btn ghost" data-act="close">Seguir jugando</button></div></div>');return false}
ACT.salirOk=()=>{closeModal();go('portada')};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset)}});
window.addEventListener('resize',()=>{if($('#office')||$('#heroScene'))drawScenes()});
render();

</script>
